<!DOCTYPE html>
<!-- 개발용 E2E 주행: 헤드리스 브라우저로 클릭 흐름 검증.
     ?flow=compass → 나침반 6축 완주 후 결과 화면 / ?flow=reverse → 물리학·정보 선택 후 계열 결과 -->
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>e2e</title>
  <link rel="stylesheet" href="../css/style.css" />
  <script>
    const FLOW = new URLSearchParams(location.search).get("flow") || "compass";
    localStorage.clear();
    localStorage.setItem("mapsi.grade", "고1");
    if (FLOW === "portfolio") {
      localStorage.setItem("mapsi.quests", JSON.stringify({ b1: { date: "2026-07-20", note: "배달비 절반이 어디로 가는지 알게 됨" }, c1: { date: "2026-07-21", note: "" } }));
      localStorage.setItem("mapsi.journal", JSON.stringify([{ date: "2026-07-22", text: "영상 편집할 때 두 시간이 금방 갔다" }]));
      localStorage.setItem("mapsi.lens.answers", JSON.stringify({ attention: "내 관심은 게임에 제일 많이 쓰인다" }));
    }
    if (FLOW === "signal") {
      // 누적 신호 사전 주입: 나침반(콘텐츠·창작 성향) + 역방향(국어·미술) + 저널 2건
      localStorage.setItem("mapsi.compass", JSON.stringify({ picks: { rhythm: "R", social: "L", space: "L", risk: "R", mode: "L", object: null }, date: "2026-07-20" }));
      localStorage.setItem("mapsi.reverse", JSON.stringify({ subjects: ["kor", "artv"], date: "2026-07-21" }));
      localStorage.setItem("mapsi.journal", JSON.stringify([
        { date: "2026-07-22", text: "웹툰 콘티 따라 그릴 때 두 시간이 금방 갔다" },
        { date: "2026-07-23", text: "친구 영상 편집 도와줄 때 재밌었다" },
      ]));
    }
    location.hash = { reverse: "#reverse", compass: "#compass", crisis: "#home", search: "#home", journal: "#journal", quest: "#quests", signal: "#signal", shield: "#shield", portfolio: "#portfolio", parents: "#parents", guide: "#q/E7", altmiss: "#altschools", jobsearch: "#home" }[FLOW] || "#home";
  </script>
</head>
<body>
  <div id="app" class="app">
    <header class="topbar">
      <button id="brandBtn" class="brand" type="button">🧭 마이드림</button>
      <button id="gradeBtn" class="grade-pill" type="button"></button>
    </header>
    <main id="screen" class="screen"></main>
    <footer class="care-footer">청소년상담 1388</footer>
  </div>
  <script src="../data/content.data.js"></script>
  <script src="../data/modules.data.js"></script>
  <script src="../data/care.data.js"></script>
  <script src="../data/lens.data.js"></script>
  <script src="../data/jobs.data.js"></script>
  <script src="../data/explore.data.js"></script>
  <script src="../data/quest.data.js"></script>
  <script src="../data/shield.data.js"></script>
  <script src="../data/parents.data.js"></script>
  <script src="../data/dday.data.js"></script>
  <script src="../data/jobdex.data.js"></script>
  <script src="../data/paths.data.js"></script>
  <script src="../data/guides.data.js"></script>
  <script src="../data/hischool.data.js"></script>
  <script src="../data/majors.data.js"></script>
  <script src="../data/artprep.data.js"></script>
  <script src="../data/altschools.data.js"></script>
  <script src="../data/clergy.data.js"></script>
  <script src="../data/jobdict.data.js"></script>
  <script src="../data/careernet.data.js"></script>
  <script src="../js/content.js"></script>
  <script src="../js/compass.js"></script>
  <script src="../js/reverse.js"></script>
  <script src="../js/care.js"></script>
  <script src="../js/lens.js"></script>
  <script src="../js/quests.js"></script>
  <script src="../js/shield.js"></script>
  <script src="../js/signal.js"></script>
  <script src="../js/portfolio.js"></script>
  <script src="../js/api.js"></script>
  <script src="../js/daily.js"></script>
  <script src="../js/altschools.js"></script>
  <script src="../js/clergy.js"></script>
  <script src="../js/app.js"></script>
  <script>
    const click = (sel) => { const el = document.querySelector(sel); if (el) el.click(); return !!el; };
    setTimeout(() => {
      if (FLOW === "compass") {
        click("#startBtn");
        // 6축: 개발·데이터 성향으로 좌/우 교차 선택 (혼자·실내·분석·사물)
        const sides = ["L", "L", "L", "R", "R", "R"];
        let i = 0;
        const timer = setInterval(() => {
          const btns = document.querySelectorAll(".opt-btn");
          if (btns.length === 2 && i < 6) { btns[sides[i] === "L" ? 0 : 1].click(); i++; }
          else clearInterval(timer);
        }, 60);
      } else if (FLOW === "reverse") {
        click('[data-sub="phys"]');
        click('[data-sub="info"]');
        setTimeout(() => click("#mapBtn"), 80);
      } else if (FLOW === "crisis" || FLOW === "search" || FLOW === "jobsearch") {
        // 학년 주입이 고1이므로 search는 고1에 해당하는 질문어, jobsearch는 직업명으로 2층 구조를 검사
        const input = document.querySelector("#searchInput");
        input.value = FLOW === "crisis" ? "사라지고 싶어요" : FLOW === "jobsearch" ? "간호사" : "선택과목 어떻게 골라요";
        document.querySelector("#searchForm").dispatchEvent(new Event("submit", { cancelable: true }));
      } else if (FLOW === "journal") {
        click('[data-mood="heavy"]');
        setTimeout(() => {
          document.querySelector("#journalInput").value = "노래 만드는 영상 볼 때 시간 순삭";
          document.querySelector("#journalForm").dispatchEvent(new Event("submit", { cancelable: true }));
        }, 120);
      } else if (FLOW === "quest") {
        click('[data-doing="b1"]');
        setTimeout(() => {
          document.querySelector("#qnote-b1").value = "배달비의 반이 플랫폼 몫인 줄 몰랐다";
          document.querySelector("#qform-b1").dispatchEvent(new Event("submit", { cancelable: true }));
        }, 120);
      } else if (FLOW === "portfolio") {
        // 기록 3개 선택 → 초안 생성
        const picks = document.querySelectorAll("[data-pick]");
        if (picks[0]) picks[0].click();
        setTimeout(() => { const p = document.querySelectorAll("[data-pick]"); if (p[1]) p[1].click(); }, 100);
        setTimeout(() => { const p = document.querySelectorAll("[data-pick]"); if (p[2]) p[2].click(); }, 200);
      } else if (FLOW === "parents") {
        click('[data-worry="stability"]');
      } else if (FLOW === "guide") {
        click("#l3Btn"); // 답변(E7)의 L3 버튼 → 가이드 카드로 전환되는지
      } else if (FLOW === "altmiss") {
        // 목록에 없는 기관명 검색 → '확인되지 않은 시설' 안내 화면
        document.querySelector("#altSearchInput").value = "무명배움터";
        document.querySelector("#altSearchForm").dispatchEvent(new Event("submit", { cancelable: true }));
      }
    }, 150);
  </script>
</body>
</html>
